<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- logo -->
    <header>
      <a href="/"> <img src="./logo.jpg" alt="Logo" class="logo" /></a>
      <h1>Akan Name Generator</h1>
      <p>
        <strong><em>Discover Your Akan Name</em></strong>
      </p>
      <nav>
      <a href="#home">Home</a>
      <a href="#About">About</a>
      <a href="#Names">Names</a>
    </nav>
    </header>
    <!-- home -->
    <section id="home">
      <h2>Welcome to My Akan Name Generator</h2>
      <p>
        Discover your unique Akan name based on your birth date and gender.
      </p>
    </section>
    
      <form>
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" required /><br /><br />

        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" required /><br /><br />

        <label for="message">Message:</label><br />
        <textarea id="message" name="message" rows="5" required></textarea
        ><br /><br />

        <button type="submit">Send Message</button>
      </form>
    </section>
    <footer>
      <p>©2026 Photography Website. All rights reserved.</p>
    </footer>
  </body>
</html>
